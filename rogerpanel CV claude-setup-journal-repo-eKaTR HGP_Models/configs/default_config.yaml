# ============================================================================
# Uncertainty-Calibrated Hierarchical Gaussian Processes for IDPS
# Default Configuration — matches Neurocomputing Revised Manuscript
# ============================================================================

seed: 42

# ---------- hardware & software ----------
hardware:
  device: "cuda"          # "cuda" or "cpu"
  num_workers: 4
  pin_memory: true

software:
  pytorch: "2.1.0"
  gpytorch: "1.11"
  cuda: "12.1"

# ---------- dataset ----------
dataset:
  name: "ics3d"
  kaggle_slug: "rogernickanaedevha/integrated-cloud-security-3datasets-ics3d"
  domains:
    - edge_iiot
    - container
    - soc
  winsorize_low: 0.1      # percentile
  winsorize_high: 99.9

# ---------- projection network (Section IV.A, Eq. 25-27) ----------
projection:
  layers: [128, 64, 32]   # hidden dims; input dim inferred per domain
  activation: "silu"       # SiLU / Swish
  dropout: 0.1
  batch_norm: true

# ---------- kernel design (Section IV.B, Appendix D) ----------
kernels:
  shared:
    type: "rbf"
    ard: true
    lengthscale_prior_mean: 0.0
    lengthscale_prior_std: 1.0

  temporal:
    rbf_scales:            # log10(seconds)
      microsecond: -6
      millisecond: -3
      second: 0
      minute: 2
      hour: 3.6
      day: 4.9
      week: 5.8
    periodic_periods:      # seconds
      hourly: 3600
      daily: 86400
      weekly: 604800
    spectral_mixtures: 4
    changepoint: true

  domain_specific:
    edge_iiot:
      protocol_embedding_dim: 32
      flow_ard: true
    container:
      iat_histogram_bins: 50
      packet_size_ard: true
    soc:
      metapath_max_length: 3
      alert_components: ["severity", "category", "confidence"]

  centering:
    enabled: true
    mc_samples: 1024       # for empirical centering

# ---------- inducing points (Appendix H.3) ----------
inducing_points:
  edge_iiot: 500
  container: 300
  soc: 200
  shared: 300
  init: "kmeans"           # "kmeans" or "random"
  class_weighted: true     # sqrt(1/n_c) weighting per Eq. 36

# ---------- adversarial training (Appendix E, H.5) ----------
adversarial:
  enabled: true
  epsilon: 0.01            # L2 perturbation budget
  pgd_steps: 10
  step_size: 0.001         # alpha = epsilon / K_PGD
  frequency: 5             # adversarial update every N epochs

# ---------- training schedule (Appendix H.3) ----------
training:
  epochs: 100
  batch_size:
    edge_iiot: 2048
    container: 1024
    soc: 4096
  optimizer:
    variational:
      type: "adam"
      lr: 0.001
      betas: [0.9, 0.999]
    hyperparameters:
      type: "lbfgs"
      max_iter: 100
  scheduler:
    type: "cosine_warm_restarts"
    T_0: 20
    T_mult: 2
    eta_min: 0.00001
  gradient_clip: 1.0
  gradient_accumulation_steps: 4
  early_stopping:
    patience: 10
    metric: "val_elbo"
  validation_every: 5
  checkpoint_best: true

# ---------- detection (Section IV.D) ----------
detection:
  base_threshold: 0.5
  uncertainty_weight: 0.5
  entropy_weight: 0.3
  adaptive_threshold: true
  imbalance_ratios:
    edge_iiot: 2.67
    container: 15.7
    soc: 99.0
    multi: 10.0

# ---------- alert prioritisation (3-tier) ----------
alert_tiers:
  low:
    sigma_max: 1.0
    action: "log"
  medium:
    sigma_min: 1.0
    sigma_max: 2.0
    action: "queue"
  critical:
    sigma_min: 2.0
    action: "page"

# ---------- SLA targets (Appendix B.2) ----------
sla:
  accuracy_min: 0.95
  fpr_max: 0.05
  fpr_target: 0.03
  recall_critical_min: 0.90
  ece_max: 0.05
  latency:
    edge_iiot_ms: 10
    container_ms: 15
    soc_ms: 100
  throughput:
    edge_iiot_eps: 25000
    container_fps: 20000
    soc_aps: 10000

# ---------- evaluation ----------
evaluation:
  cross_validation_folds: 5
  calibration_bins: 15
  adversarial_epsilons: [0.0, 0.005, 0.01, 0.02, 0.05, 0.1]
  ablation_components:
    - "shared_kernel"
    - "domain_kernel"
    - "temporal_kernel"
    - "changepoint_kernel"
    - "adversarial_inducing"
    - "kernel_centering"
    - "deep_kernel"
